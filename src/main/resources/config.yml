  second-color: "&#FB8808"

  prefix: ""

  kick: "&#FB8808▶ &fВы были кикнуты: &#FB8808обнаружены подозрительные пакеты&f."
  kick-alert: "&#FB8808▶ &fИгрок &#FFFF00%player% &fбыл кикнут за &#FB8808подозрительные пакеты&f."

  no-permission: "&#FB8808▶ &fНедостаточно &#FB8808прав &f(%permission%) на выполнение команды!"
  invalid-arguments: "&#FB8808▶ &fНеверные &#FB8808аргументы &fкоманды!"
  injection-failure: "&#FB8808▶ &fОшибка внедрения &#FB8808сетевого обработчика&f!"
  update-found: "&#FFFF00◆ &fНайдено новое обновление &#FFFF00LPX&f!"
  null-address: "&#FB8808▶ &fВход с недопустимым адресом подключения!"
  unknown-command: "&#FB8808▶ &fНеизвестная команда. Введите &#FFFF00/help &fдля списка команд."

  alerts:
    permission: "lpx.alerts"
    format: "&#FB8808▶ &fИгрок &#FFFF00%player% &fпровалил проверку &#FFFF00%check% %type% &8(&#FB8808%vl%&7/&#FFFF00%max-vl%&8)"
    hover:
      - "&#FFFF00▶ &fОписание: &#FFFF00%description%"
      - "&#FB8808◆ &fИнформация: &#FFFF00%infos%"
    enabled: "&#FFFF00◆ &fОповещения защиты &#FFFF00включены&f!"
    disabled: "&#FB8808▶ &fОповещения защиты &#FB8808выключены&f!" 

options:
  silent-failures: false

  alerts-on-join: true

  kick-on-exception: true

  disable-item-decoding: SMART

  creative-exempts:
    - "custom_name"
    - "lore"
    - "enchantments"

  max-item-depth: 4

  max-items-per-packet: 1458

  hidden-command: false

  bypass-permission: false

  geyser: false

  axiom: false

  check-updates: true

  bstats: true

  clear-task:
    enabled: true
    delay: 300

  printer:
    automatic: false
    place-threshold: 10
    disable-delay: 3000
    alerts: true
    permission: "lpx.alerts.printer"
    join: "&#FFFF00◆ &fИгрок &#FFFF00%player% &fвошёл в режим принтера &8(&#FFFF00%mode%&8)"
    leave: "&#FB8808▶ &fИгрок &#FFFF00%player% &fвышел из режима принтера"

  mechanics:
    nether-portal-delay: 1000
    max-arrow-velocity: 15
    shears-cooldown: 500
    break-close-inventory: false
    trapdoor-rail-redstone: true
    interact-container-delay: 100

  alerts:
    store: true
    days: 14

  server: unnamed

  punish-delay: 1000

  debug: false

  log-cancelled-packets: true

  item-strip:
    enabled: false
    set-slot: false
    remove-components:
      - "container"
    remove-nbt:
      - "BlockEntityTag"

  external-config: false

discord:
  enabled: false
  url: ""
  color: "#FB8808"
  content:
    - "**Игрок**: %player%"
    - "**Проверка**: %check% %type%"
    - "**VL**: %vl%/%max-vl%"
    - "**Информация**: %infos%"
    - "**Описание**: %description%"

packet-logger:
  heavy-packet-threshold: 5000000

  heavy-ignored-packets:
    - PONG

  enabled: false

  output: FILE

  netty-watchdog:
    max-time: 50
    check-frequency: 25
    report-cooldown: 5000

  player-mode: whitelist

